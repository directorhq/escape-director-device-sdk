name: SDK checks
on:
  # Pull requests run the checks once; main runs them after each merge.
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # A newer push to the same pull request or branch cancels the older run.
  group: sdk-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      # The ed::Room host test compiles against the real ArduinoJson headers.
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
      - run: arduino-cli lib install ArduinoJson@7.4.3
      - run: npm run check
