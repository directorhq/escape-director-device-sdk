name: Firmware compile
on:
  # A change to Markdown alone cannot change what the sketches compile to.
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
permissions:
  contents: read
concurrency:
  # A newer push to the same pull request or branch cancels the older run.
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Compiles the sketches for each bundled adapter with the baseline versions in
  # docs/compatibility.md. Compilation is not hardware qualification.
  # A fixed job name keeps the required check stable when a core version changes.
  firmware:
    name: firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: uno-r4-wifi
            core: arduino:renesas_uno@1.5.3
            fqbn: arduino:renesas_uno:unor4wifi
          - board: giga
            core: arduino:mbed_giga@4.6.0
            fqbn: arduino:mbed_giga:giga
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.arduino15
          key: arduino-${{ matrix.core }}-ArduinoJson-7.4.3-ArduinoMqttClient-0.1.8
      - run: arduino-cli core update-index
      - run: arduino-cli core install ${{ matrix.core }}
      - run: arduino-cli lib install ArduinoJson@7.4.3 ArduinoMqttClient@0.1.8
      - run: arduino-cli compile --warnings default --fqbn ${{ matrix.fqbn }} --library . examples/room_basic
      - run: arduino-cli compile --warnings default --fqbn ${{ matrix.fqbn }} --library . examples/button_code
